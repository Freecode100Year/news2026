name = "prompter"
main = "src/index.js"
compatibility_date = "2026-07-24"

routes = [
  { pattern = "ticiqi.freedom8964.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "PROMPTER_ROOM"
class_name = "PrompterRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrompterRoom"]

[observability]
enabled = true
