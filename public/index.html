<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新闻直播提词系统 · NewsPrompter 2026</title>
<style>
  :root {
    --bg: #0F1015; --panel: #1A1B22; --border: #2A2B35;
    --text: #F5F5F0; --dim: #8B8C95; --cue: #3DDC84; --live: #FF4D5E; --amber: #E8A23D;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--sans); display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 20px;
  }
  .hero { text-align: center; max-width: 600px; margin-bottom: 40px; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; background: rgba(61,220,132,0.15); color: var(--cue); font-family: var(--mono); font-size: 12px; font-weight: 600; margin-bottom: 16px; border: 1px solid rgba(61,220,132,0.3); }
  h1 { font-size: 28px; margin: 0 0 12px 0; font-weight: 800; letter-spacing: -0.02em; }
  p.sub { color: var(--dim); font-size: 14px; margin: 0; line-height: 1.6; }
  
  .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 720px; width: 100%; }
  a.card {
    display: flex; flex-direction: column; flex: 1; min-width: 300px; padding: 28px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--border); text-decoration: none; color: var(--text);
    transition: all 0.25s ease;
  }
  a.card:hover { border-color: var(--cue); transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.3); }
  a.card .dot { width: 10px; height: 10px; border-radius: 50%; margin-bottom: 16px; }
  a.card.director .dot { background: var(--cue); box-shadow: 0 0 10px rgba(61,220,132,0.5); }
  a.card.anchor .dot { background: var(--live); box-shadow: 0 0 10px rgba(255,77,94,0.5); }
  a.card h2 { font-size: 18px; margin: 0 0 8px 0; font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
  a.card p { font-size: 13px; color: var(--dim); margin: 0; line-height: 1.6; }
  .card-features { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; flex-wrap: wrap; gap: 8px; }
  .feat-tag { font-size: 11px; font-family: var(--mono); background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px; color: var(--dim); }

  footer { margin-top: 48px; font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
  <div class="hero">
    <div class="badge">PROMPTER 2.0</div>
    <h1>新闻直播双端提词系统</h1>
    <p class="sub">云端/局域网双轨实时同步 · 导播多视角操控 · 多路主播同步滚动与独立字号 · 二维码一键安全入房</p>
  </div>

  <div class="cards">
    <a class="card director" href="./director.html">
      <div class="dot"></div>
      <h2>导播控制台 <span>→</span></h2>
      <p>导入/编排稿件、房间密码与有效期保护、双人对话标记、时间戳与开播倒计时联动、实时扫码邀请。</p>
      <div class="card-features">
        <span class="feat-tag">密码保护</span>
        <span class="feat-tag">时间戳标记</span>
        <span class="feat-tag">开播倒计时</span>
        <span class="feat-tag">二维码邀请</span>
      </div>
    </a>

    <a class="card anchor" href="./anchor.html">
      <div class="dot"></div>
      <h2>主播端显示 <span>→</span></h2>
      <p>双人主持独立字号与角色高亮、硬件提词器反射屏适配、全屏滚动与断网无缝自愈运行。</p>
      <div class="card-features">
        <span class="feat-tag">双视角支持</span>
        <span class="feat-tag">独立字号</span>
        <span class="feat-tag">离线自愈</span>
        <span class="feat-tag">镜像翻转</span>
      </div>
    </a>
  </div>

  <footer>新闻直播提词系统 &copy; 2026 · 支持 Cloudflare Workers &amp; Durable Objects</footer>
</body>
</html>
