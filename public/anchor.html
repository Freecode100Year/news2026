<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>提词器 · 主播端</title>
<link rel="manifest" href="manifest-anchor.webmanifest">
<link rel="apple-touch-icon" href="icon-anchor.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#08080A">
<style>
  :root {
    --void: #08080A;
    --text-primary: #F5F5F0;
    --text-dim: #6B6C72;
    --hair: #26272C;
    --live: #FF4D5E;
    --cue: #3DDC84;
    --amber: #E8A23D;
    --anchor-a: #4FA8E8;
    --anchor-b: #F06292;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; background: var(--void); overflow: hidden;
    font-family: var(--sans); color: var(--text-primary); user-select: none;
  }

  #statusbar {
    position: fixed; top: 0; left: 0; right: 0; height: 44px;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: linear-gradient(to bottom, rgba(8,8,10,0.95), rgba(8,8,10,0));
    z-index: 50; font-family: var(--mono); font-size: 12px;
    letter-spacing: 0.03em; color: var(--text-dim); transition: opacity 0.4s;
  }
  .tally { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
  .tally.live { background: var(--live); box-shadow: 0 0 8px 2px rgba(255,77,94,0.65); animation: pulse 1.8s ease-in-out infinite; }
  .tally.local { background: var(--amber); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

  #roleSelector {
    background: #141519; border: 1px solid var(--hair); color: var(--text-primary);
    border-radius: 6px; padding: 4px 8px; font-size: 11.5px; font-family: var(--mono); cursor: pointer;
    outline: none; height: 28px; display: inline-flex; align-items: center;
  }

  #gearBtn {
    background: transparent; border: 1px solid var(--hair); color: var(--text-dim); border-radius: 6px;
    width: 28px; height: 28px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }

  #canvasFrame { position: fixed; inset: 0; cursor: grab; }
  #canvasFrame:active { cursor: grabbing; }
  #stage { position: absolute; inset: 0; display: flex; justify-content: center; }
  
  #track { width: min(860px, 92vw); padding-top: 50vh; padding-bottom: 50vh; will-change: transform; transition: width 0.3s ease; }
  #track.eye-guard { width: min(480px, 68vw) !important; text-align: center; }

  #script {
    font-size: 48px; line-height: 1.6; font-weight: 600;
    white-space: pre-wrap; word-break: break-word; transition: font-size 0.2s, transform 0.3s ease;
  }
  #script.mirror-x { transform: scaleX(-1); }
  #script.mirror-y { transform: scaleY(-1); }
  #script.mirror-xy { transform: scale(-1, -1); }

  .para { margin: 0 0 1.2em 0; transition: opacity 0.3s, transform 0.3s; opacity: 0.35; filter: blur(0.3px); }
  .para.focus-active { opacity: 1 !important; filter: none !important; font-weight: 700; }
  .para.role-a { border-left: 4px solid var(--anchor-a); padding-left: 12px; }
  .para.role-b { border-left: 4px solid var(--anchor-b); padding-left: 12px; }
  .para.breaking-news { border: 2px solid var(--live); padding: 10px; border-radius: 8px; background: rgba(255,77,94,0.1); animation: flashBorder 2s infinite; }
  .para.dimmed { opacity: 0.15 !important; }

  @keyframes flashBorder { 0%,100% { border-color: var(--live); } 50% { border-color: transparent; } }

  ruby { ruby-position: over; }
  rt { font-size: 0.45em; color: var(--cue); font-weight: normal; font-family: var(--mono); }
  strong.emphasis { color: var(--amber); text-decoration: underline; text-underline-offset: 6px; }

  #focusline { position: fixed; left: 0; right: 0; top: 50%; height: 2px; background: linear-gradient(to right, transparent, rgba(61,220,132,0.3), transparent); z-index: 5; pointer-events: none; }

  #cdOverlay {
    position: fixed; inset: 0; z-index: 90; display: none; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(8,8,10,0.95);
    font-family: var(--mono);
  }
  #cdOverlay .sub { font-size: 18px; color: var(--amber); letter-spacing: 0.1em; margin-bottom: 20px; }
  #cdOverlay .num { font-size: 140px; font-weight: 800; color: var(--cue); line-height: 1; }

  #setup {
    position: fixed; inset: 0; background: var(--void); display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 100; padding: 24px; text-align: center; overflow-y: auto;
  }
  #setup h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px 0; }
  #setup p.desc { color: var(--text-dim); font-size: 13px; margin: 0; max-width: 340px; }
  #setup input {
    width: min(320px, 85vw); height: 42px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--hair);
    background: #101013; color: var(--text-primary); font-size: 14px; text-align: center; box-sizing: border-box;
  }
  #setup input#roomInput { font-family: var(--mono); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
  #setup button.primary {
    width: min(320px, 85vw); height: 44px; border-radius: 8px; border: none; background: var(--cue); color: #05130B; font-weight: 700; font-size: 15px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
  }
  #errorTip { color: var(--live); font-size: 12.5px; margin-top: 4px; display: none; }

  #toastContainer {
    position: fixed; top: 56px; right: 16px; z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .toast {
    background: rgba(26,27,34,0.92); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px 18px;
    font-size: 13px; color: var(--text-primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex; align-items: center; gap: 10px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto;
  }
  .toast.show { transform: translateX(0); }
  .toast.warning { border-color: rgba(232,162,61,0.5); background: rgba(35,28,18,0.95); color: var(--amber); }
  .toast.success { border-color: rgba(61,220,132,0.5); background: rgba(18,35,25,0.95); color: var(--cue); }

  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(300px, 85vw);
    background: #121317; border-left: 1px solid var(--hair); z-index: 95;
    transform: translateX(100%); transition: transform 0.25s ease; padding: 20px;
    box-shadow: -4px 0 20px rgba(0,0,0,0.5);
  }
  #drawer.open { transform: translateX(0); }
  #drawer h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 16px 0 10px 0; }
  #drawer label { font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; margin-bottom: 6px; }
  #drawer input[type=range], #drawer select { width: 100%; margin-bottom: 14px; accent-color: var(--cue); cursor: pointer; background:#1A1B20; color:#fff; border:1px solid var(--hair); padding:6px; border-radius:6px; }
  #closeDrawer { position: absolute; top: 14px; right: 14px; background: transparent; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<div id="toastContainer"></div>

<div id="setup">
  <h1>提词器 · 主播端</h1>
  <p class="desc">输入导播提供的房间码以连接频道。</p>
  <input id="roomInput" maxlength="12" placeholder="房间码" autocapitalize="characters">
  <input id="passInput" placeholder="房间密码(若设置)" type="password">
  <input id="serverInput" placeholder="服务器地址" style="font-size:13px; text-transform:none;">
  <button class="primary" id="connectBtn">进入房间</button>
  <div id="errorTip"></div>
</div>

<div id="statusbar">
  <button id="gearBtn" title="打开设置">⚙</button>
  <span class="tally" id="tally"></span>
  <span id="roomLabel">未连接</span>
  <select id="roleSelector">
    <option value="ALL">视角: 全员台词</option>
    <option value="A">视角: 主播 A (主台)</option>
    <option value="B">视角: 主播 B (副台)</option>
  </select>
</div>

<div id="focusline"></div>

<div id="canvasFrame">
  <div id="stage">
    <div id="track">
      <div id="script"><div class="para focus-active">等待导播推送稿件...</div></div>
    </div>
  </div>
</div>

<div id="cdOverlay">
  <div class="sub">直播即将开始</div>
  <div class="num" id="cdNum">10</div>
</div>

<div id="drawer">
  <button id="closeDrawer">✕</button>
  <h3 style="margin-top:0;">硬件反射屏镜像控制</h3>
  <label>镜像维度</label>
  <select id="mirrorSelect">
    <option value="none">不镜像 (常规屏幕)</option>
    <option value="x">左右翻转 (常见硬件分光屏)</option>
    <option value="y">上下翻转 (倒挂反射屏)</option>
    <option value="xy">双向完全翻转</option>
  </select>
  <h3>眼神与出镜保护</h3>
  <label style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
    <span>自然出镜 (文本视角收窄)</span>
    <input type="checkbox" id="eyeGuardCheck" checked style="accent-color:var(--cue);">
  </label>
  <h3 style="margin-top:20px;">本地独立字号与行距</h3>
  <label>字号大小 <span id="localFontVal" style="font-family:var(--mono); color:var(--cue);">48px</span></label>
  <input type="range" id="localFontSlider" min="28" max="96" step="2" value="48">
  <label>行间距</label>
  <input type="range" id="localLineSlider" min="1.2" max="2.2" step="0.05" value="1.55">
</div>

<script>
  let ws = null;
  let hasConnectedOnce = false;
  let state = { script: '', scrollRatio: 0, playing: false, speed: 1, mirrored: false, fontSize: 48, lineHeight: 1.55, eyeContactGuard: true };
  let currentRole = 'ALL';
  let localFontSize = parseInt(localStorage.getItem('anchor_font') || '48');
  let lastReportedParaIdx = -1;

  const setup = document.getElementById('setup');
  const roomInput = document.getElementById('roomInput');
  const passInput = document.getElementById('passInput');
  const serverInput = document.getElementById('serverInput');
  const scriptEl = document.getElementById('script');
  const trackEl = document.getElementById('track');
  const errorTip = document.getElementById('errorTip');
  const roleSelector = document.getElementById('roleSelector');

  function showToast(msg, type = 'info', duration = 3500) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  window.addEventListener('offline', () => {
    if (hasConnectedOnce) {
      document.getElementById('tally').className = 'tally local';
      showToast('⚠️ 网络已断开，已自动切换为本地离线模式', 'warning', 4500);
    }
  });
  window.addEventListener('online', () => {
    if (hasConnectedOnce) {
      showToast('🌐 物理网络已恢复，正在恢复云端频道连接', 'info', 3000);
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    serverInput.value = `${wsProto}//${location.host}`;

    const cachedState = localStorage.getItem('anchor_cached_state');
    if (cachedState) {
      try {
        state = { ...state, ...JSON.parse(cachedState) };
        renderScript();
      } catch (e) {}
    }

    const params = new URLSearchParams(location.search);
    if (params.get('room')) roomInput.value = params.get('room').toUpperCase();
    if (params.get('pass')) passInput.value = params.get('pass');

    if (params.get('room')) connectRoom();
    
    window.addEventListener('wheel', (e) => {
      const delta = e.deltaY > 0 ? 0.02 : -0.02;
      state.scrollRatio = Math.max(0, Math.min(1, state.scrollRatio + delta));
      updateScrollPosition();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        state.playing = !state.playing;
        showToast(state.playing ? '▶ 启动滚动' : '⏸ 暂停滚动', 'info', 1500);
      } else if (e.code === 'ArrowUp') {
        state.scrollRatio = Math.max(0, state.scrollRatio - 0.03);
        updateScrollPosition();
      } else if (e.code === 'ArrowDown') {
        state.scrollRatio = Math.min(1, state.scrollRatio + 0.03);
        updateScrollPosition();
      }
    });
  });

  document.getElementById('connectBtn').addEventListener('click', connectRoom);

  function connectRoom() {
    const room = roomInput.value.trim().toUpperCase();
    const pass = passInput.value.trim();
    const server = serverInput.value.trim().replace(/\/$/, '');

    if (!room) { showError('请填写房间码'); return; }

    const wsUrl = `${server}/room/${room}/ws?role=anchor&anchorRole=${currentRole}&pass=${encodeURIComponent(pass)}`;
    if (ws) {
      ws.onclose = null;
      ws.close();
    }

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      hasConnectedOnce = true;
      setup.style.display = 'none';
      document.getElementById('tally').className = 'tally live';
      document.getElementById('roomLabel').textContent = `房间: ${room}`;
      showToast('🌐 已成功与导播控制台连通', 'success');
    };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        state = { ...state, ...msg.payload };
        localStorage.setItem('anchor_cached_state', JSON.stringify(state));
        renderScript();
      } else if (msg.type === 'action' && msg.payload === 'flashCue') {
        showToast('⚠️ 导播提示：请注意最新稿件调整！', 'warning', 4500);
      }
    };

    ws.onerror = () => { showError('连接错误或密码无效'); };
    ws.onclose = (e) => {
      document.getElementById('tally').className = 'tally local';
      if (hasConnectedOnce) {
        showToast('⚠️ 网络已断开，提词器维持本地流畅模式', 'warning', 4000);
      }
      if (setup.style.display !== 'none') showError(e.reason || '无法进入房间，请检查密码或房间码');
    };
  }

  function showError(msg) {
    errorTip.textContent = msg;
    errorTip.style.display = 'block';
  }

  roleSelector.addEventListener('change', (e) => {
    currentRole = e.target.value;
    renderScript();
  });

  function parseScriptLine(line) {
    let html = line.replace(/\{([^|]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
    html = html.replace(/\*([^*]+)\*/g, '<strong class="emphasis">$1</strong>');
    return html;
  }

  function renderScript() {
    const mirrorMode = document.getElementById('mirrorSelect').value;
    scriptEl.className = mirrorMode !== 'none' ? `mirror-${mirrorMode}` : (state.mirrored ? 'mirror-x' : '');
    scriptEl.style.fontSize = `${localFontSize}px`;
    scriptEl.style.lineHeight = state.lineHeight;

    const useEyeGuard = document.getElementById('eyeGuardCheck').checked && state.eyeContactGuard;
    trackEl.className = useEyeGuard ? 'eye-guard' : '';

    const lines = (state.script || '').split('\n');
    scriptEl.innerHTML = '';

    lines.forEach((line, idx) => {
      const p = document.createElement('div');
      p.className = 'para';
      p.dataset.idx = idx;

      if (line.includes('[突发新闻]') || line.includes('[BREAKING]')) {
        p.classList.add('breaking-news');
      }

      if (line.includes('[主播A]') || line.startsWith('A:')) {
        p.classList.add('role-a');
        if (currentRole === 'B') p.classList.add('dimmed');
      } else if (line.includes('[主播B]') || line.startsWith('B:')) {
        p.classList.add('role-b');
        if (currentRole === 'A') p.classList.add('dimmed');
      }

      p.innerHTML = parseScriptLine(line);
      scriptEl.appendChild(p);
    });

    updateScrollPosition();
    checkCountdown();
  }

  function updateScrollPosition() {
    const totalHeight = trackEl.scrollHeight - window.innerHeight;
    if (totalHeight > 0) {
      const targetTop = state.scrollRatio * totalHeight;
      trackEl.style.transform = `translateY(-${targetTop}px)`;
      updateFocusHighlight(targetTop);
    }
  }

  function updateFocusHighlight(currentTop) {
    const centerY = window.innerHeight * 0.5 + currentTop;
    const paras = Array.from(scriptEl.querySelectorAll('.para'));
    let currentFocusIdx = 0;

    paras.forEach((p, idx) => {
      const top = p.offsetTop;
      const height = p.offsetHeight;
      if (centerY >= top && centerY <= top + height + 25) {
        p.classList.add('focus-active');
        currentFocusIdx = idx;
      } else {
        p.classList.remove('focus-active');
      }
    });

    if (currentFocusIdx !== lastReportedParaIdx && ws && ws.readyState === WebSocket.OPEN) {
      lastReportedParaIdx = currentFocusIdx;
      ws.send(JSON.stringify({
        type: 'anchorProgress',
        payload: { paraIdx: currentFocusIdx, ratio: state.scrollRatio }
      }));
    }
  }

  function checkCountdown() {
    const cdOverlay = document.getElementById('cdOverlay');
    if (state.liveCountdown) {
      cdOverlay.style.display = 'flex';
      const sec = Math.ceil((state.liveCountdown - Date.now()) / 1000);
      document.getElementById('cdNum').textContent = Math.max(0, sec);
    } else {
      cdOverlay.style.display = 'none';
    }
  }

  document.getElementById('gearBtn').onclick = () => document.getElementById('drawer').classList.add('open');
  document.getElementById('closeDrawer').onclick = () => document.getElementById('drawer').classList.remove('open');
  document.getElementById('eyeGuardCheck').onchange = renderScript;
  document.getElementById('mirrorSelect').onchange = renderScript;
  document.getElementById('localFontSlider').oninput = (e) => {
    localFontSize = parseInt(e.target.value);
    document.getElementById('localFontVal').textContent = `${localFontSize}px`;
    localStorage.setItem('anchor_font', localFontSize);
    renderScript();
  };
</script>
</body>
</html>
